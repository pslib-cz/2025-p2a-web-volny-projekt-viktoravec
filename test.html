<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger menu bez JS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* Header */
header {
    height: 70px;
    padding: 0 20px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    position: relative;
    background: white;
}

/* Skrytý checkbox */
#menu-toggle {
    display: none;
}

/* Hamburger */
.hamburger {
    width: 30px;
    cursor: pointer;
    z-index: 1000;
}

.hamburger span {
    display: block;
    height: 3px;
    background: black;
    margin: 6px 0;
    transition: 0.3s;
}

/* Menu */
nav {
    position: absolute;
    top: 70px;
    right: 0;

    width: 100%;
    background: #555;

    display: flex;
    flex-direction: column;

    transform: translateX(100%);
    transition: transform 0.35s ease;

    overflow: hidden;
}

/* Položky */
nav a {
    color: white;
    text-decoration: none;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
}

nav a:last-child {
    border-bottom: none;
}

/* Otevření menu */
#menu-toggle:checked ~ nav {
    transform: translateX(0);
}

/* Animace hamburger -> křížek */
#menu-toggle:checked + .hamburger span:nth-child(1) {
    transform: rotate(45deg) translate(6px, 7px);
}

#menu-toggle:checked + .hamburger span:nth-child(2) {
    opacity: 0;
}

#menu-toggle:checked + .hamburger span:nth-child(3) {
    transform: rotate(-45deg) translate(6px, -7px);
}

/* Desktop */
@media (min-width: 769px) {
    .hamburger,
    nav,
    #menu-toggle {
        display: none;
    }
}
</style>
</head>
<body>

<header>

    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <nav>
        <a href="#">Domů</a>
        <a href="#">Služby</a>
        <a href="#">Reference</a>
        <a href="#">Kontakt</a>
    </nav>

</header>

</body>
</html>
